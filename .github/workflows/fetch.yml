name: Fetch FMI data
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    if: ${{ vars.FETCH_ENABLED == 'true' }}
    steps:
      - run: >
          curl --fail-with-body --silent --show-error --max-time 290
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          "${{ secrets.FETCH_URL }}"
